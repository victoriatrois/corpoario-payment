quarkus.application.name=corpoario-payment
quarkus.http.port=8080

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/payment}
quarkus.datasource.username=${DB_USER:payment}
quarkus.datasource.password=${DB_PASSWORD:payment}
quarkus.hibernate-orm.database.generation=none

# Flyway (scripts em src/main/resources/db/migration)
quarkus.flyway.migrate-at-start=true

# RabbitMQ (canais devem ser declarados ao implementar produtores/consumidores)
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USER:guest}
rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# Provedor de pagamento (valores via variáveis de ambiente, sem credenciais)
payment-provider.base-url=${PAYMENT_PROVIDER_BASE_URL:}
payment-provider.api-key=${PAYMENT_PROVIDER_API_KEY:}
# Uso futuro com @RegisterRestClient(configKey = "payment-provider")
quarkus.rest-client.payment-provider.url=${PAYMENT_PROVIDER_BASE_URL:http://localhost:8081}
quarkus.rest-client.payment-provider.connect-timeout=5000
quarkus.rest-client.payment-provider.read-timeout=10000

# OpenAPI, health e métricas
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.micrometer.export.prometheus.enabled=true

# Testes: sem banco e sem Flyway até existirem entidades/migrações
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.datasource.devservices.enabled=false
